<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Candidate invitation pages do not contact a third-party font service.
      if (!/^\/interview\/(join|session)\/?$/.test(location.pathname)) {
        const font = document.createElement('link')
        font.rel = 'stylesheet'
        font.href = 'https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap'
        document.head.appendChild(font)
      } else {
        const policy = document.createElement('meta')
        policy.name = 'referrer'
        policy.content = 'no-referrer'
        document.head.appendChild(policy)
      }
    </script>
    <title>MenaITech · HR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
